
<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>燈塔白色閃光</title>


<style>

/* =========================
   基本
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at center,
            #1b2738 0%,
            #080f1a 45%,
            #02050a 100%
        );

    color: white;

    font-family:
        Arial,
        "Noto Sans TC",
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

}


/* =========================
   主畫面
========================= */

.container {

    width: min(900px, 94%);

    text-align: center;

    padding: 30px 15px;

}


/* =========================
   標題
========================= */

h1 {

    margin: 0;

    font-size: clamp(28px, 5vw, 44px);

    letter-spacing: 3px;

}

.subtitle {

    margin-top: 10px;

    color: #9ba9bb;

    font-size: 16px;

}


/* =========================
   燈光區
========================= */

.light-area {

    position: relative;

    width: 360px;

    height: 360px;

    margin: 20px auto;

    display: flex;

    justify-content: center;

    align-items: center;

}


/* 外部光暈 */

.glow {

    position: absolute;

    width: 330px;

    height: 330px;

    border-radius: 50%;

    opacity: 0;

    transition: opacity 0.05s;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.7),
            rgba(255,255,255,0.2) 30%,
            transparent 70%
        );

    filter: blur(10px);

}


/* 中央燈 */

.light {

    position: relative;

    width: 130px;

    height: 130px;

    border-radius: 50%;

    background: #020407;

    border: 3px solid #334155;

    box-shadow:
        inset 0 0 25px rgba(255,255,255,0.05);

    z-index: 2;

    transition:
        all 0.04s linear;

}


/* =========================
   白色閃光
========================= */

.light-area.flash .light {

    background: #ffffff;

    border-color: white;

    transform: scale(1.12);

    box-shadow:

        0 0 10px white,

        0 0 25px white,

        0 0 50px white,

        0 0 90px white,

        0 0 150px white,

        0 0 230px white;

}


.light-area.flash .glow {

    opacity: 1;

    transform: scale(1.1);

}


/* =========================
   狀態
========================= */

.status {

    font-size: 32px;

    font-weight: bold;

    min-height: 45px;

    letter-spacing: 3px;

}


.status.flash {

    color: white;

    text-shadow:
        0 0 10px white,
        0 0 25px white;

}


.status.dark {

    color: #64748b;

}


/* =========================
   倒數
========================= */

.countdown {

    margin-top: 8px;

    color: #aab7c8;

    font-size: 19px;

}


/* =========================
   按鈕
========================= */

.controls {

    margin: 25px 0;

    display: flex;

    justify-content: center;

    gap: 12px;

}


button {

    border: none;

    border-radius: 8px;

    padding: 12px 25px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.start {

    background: white;

    color: #111;

}


.reset {

    background: #334155;

    color: white;

}


/* =========================
   時間軸
========================= */

.timeline {

    background: #111c2b;

    border: 1px solid #26364a;

    border-radius: 12px;

    padding: 20px;

    text-align: left;

}


.timeline-title {

    margin-bottom: 12px;

    font-size: 18px;

    font-weight: bold;

}


/* 時間條 */

.bar {

    height: 50px;

    display: flex;

    overflow: hidden;

    border-radius: 7px;

}


/* 1.5 秒亮 */

.flash-block {

    width: 10%;

    background: white;

    color: black;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;

    font-weight: bold;

}


/* 3 秒暗 */

.dark3-block {

    width: 20%;

    background: #334155;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;

}


/* 9 秒暗 */

.dark9-block {

    width: 60%;

    background: #1e293b;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;

}


/* 進度 */

.progress-area {

    margin-top: 12px;

    height: 6px;

    background: #020617;

    border-radius: 5px;

    overflow: hidden;

}


.progress {

    width: 0%;

    height: 100%;

    background: white;

    box-shadow: 0 0 10px white;

}


/* =========================
   資訊
========================= */

.info {

    margin-top: 15px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

}


.info-box {

    background: #111c2b;

    border: 1px solid #26364a;

    border-radius: 10px;

    padding: 15px;

}


.info-box span {

    display: block;

    color: #8291a5;

    font-size: 13px;

    margin-bottom: 5px;

}


.info-box strong {

    font-size: 20px;

}


/* =========================
   手機
========================= */

@media (max-width: 600px) {

    .light-area {

        width: 280px;

        height: 280px;

    }

    .glow {

        width: 260px;

        height: 260px;

    }

    .light {

        width: 105px;

        height: 105px;

    }

    .status {

        font-size: 26px;

    }

    .controls {

        flex-direction: column;

    }

    button {

        width: 100%;

    }

    .info {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<div class="container">


    <h1>⚓ 國聖燈塔聯閃光</h1>


    <div class="subtitle">

        Fl 1.5s — Oc 3s — Fl 1.5s — Oc 9s

    </div>


    <!-- 燈光 -->

    <div
        id="lightArea"
        class="light-area"
    >

        <div
            id="glow"
            class="glow"
        ></div>


        <div
            id="light"
            class="light"
        ></div>

    </div>


    <!-- 狀態 -->

    <div
        id="status"
        class="status"
    >

        暫停

    </div>


    <div
        id="countdown"
        class="countdown"
    >

        等待開始

    </div>


    <!-- 按鈕 -->

    <div class="controls">

        <button
            id="startBtn"
            class="start"
        >

            ▶ 開始

        </button>


        <button
            id="resetBtn"
            class="reset"
        >

            ↻ 重置

        </button>

    </div>


    <!-- 時間軸 -->

    <div class="timeline">

        <div class="timeline-title">

            15 秒完整閃光週期

        </div>


        <div class="bar">


            <!-- 0 ~ 1.5 -->

            <div class="flash-block">

                Fl 1.5s

            </div>


            <!-- 1.5 ~ 4.5 -->

            <div class="dark3-block">

                Oc 3s

            </div>


            <!-- 4.5 ~ 6 -->

            <div class="flash-block">

                Fl 1.5s

            </div>


            <!-- 6 ~ 15 -->

            <div class="dark9-block">

                Oc 9s

            </div>


        </div>


        <div class="progress-area">

            <div
                id="progress"
                class="progress"
            ></div>

        </div>

    </div>


    <!-- 資訊 -->

    <div class="info">


        <div class="info-box">

            <span>

                完整週期

            </span>

            <strong>

                15 秒

            </strong>

        </div>


        <div class="info-box">

            <span>

                每週期閃光

            </span>

            <strong>

                2 次

            </strong>

        </div>


        <div class="info-box">

            <span>

                閃光時間

            </span>

            <strong>

                1.5 秒

            </strong>

        </div>


    </div>


</div>


<script>

/* =========================================
   DOM
========================================= */

const lightArea =
    document.getElementById("lightArea");

const status =
    document.getElementById("status");

const countdown =
    document.getElementById("countdown");

const startBtn =
    document.getElementById("startBtn");

const resetBtn =
    document.getElementById("resetBtn");

const progress =
    document.getElementById("progress");


/* =========================================
   閃光週期
========================================= */


/*

   0 ～ 1.5 秒
   亮

   1.5 ～ 4.5 秒
   暗

   4.5 ～ 6 秒
   亮

   6 ～ 15 秒
   暗


   完整週期：
   15 秒

*/


const CYCLE = 15000;


/* 閃光區 */

const FLASH_1_START = 0;

const FLASH_1_END = 1500;

const FLASH_2_START = 4500;

const FLASH_2_END = 6000;


/* =========================================
   程式狀態
========================================= */

let running = false;

let startTime = 0;

let pausedTime = 0;

let animationID = null;


/* =========================================
   判斷目前是否閃光
========================================= */

function isFlashing(t) {

    return (

        (
            t >= FLASH_1_START &&
            t < FLASH_1_END
        )

        ||

        (
            t >= FLASH_2_START &&
            t < FLASH_2_END
        )

    );

}


/* =========================================
   取得目前階段
========================================= */

function getPhase(t) {


    /* 第一閃 */

    if (t < 1500) {

        return {

            name: "白色閃光",

            remain: 1500 - t

        };

    }


    /* 暗3秒 */

    if (t < 4500) {

        return {

            name: "暗燈",

            remain: 4500 - t

        };

    }


    /* 第二閃 */

    if (t < 6000) {

        return {

            name: "白色閃光",

            remain: 6000 - t

        };

    }


    /* 暗9秒 */

    return {

        name: "暗燈",

        remain: 15000 - t

    };

}


/* =========================================
   更新
========================================= */

function update() {


    if (!running) {

        return;

    }


    const now =
        performance.now();


    const elapsed =
        now - startTime;


    /* 目前15秒位置 */

    const t =
        elapsed % CYCLE;


    /* 是否閃光 */

    const flash =
        isFlashing(t);


    /* 階段 */

    const phase =
        getPhase(t);


    /* =====================================
       白色閃光
    ===================================== */

    if (flash) {

        lightArea.classList.add("flash");

        status.classList.add("flash");

        status.classList.remove("dark");

        status.textContent =
            "● 白色閃光";

    }

    else {

        lightArea.classList.remove("flash");

        status.classList.remove("flash");

        status.classList.add("dark");

        status.textContent =
            "○ 暗燈";

    }


    /* =====================================
       倒數
    ===================================== */

    const seconds =
        (phase.remain / 1000)
        .toFixed(1);


    countdown.textContent =
        phase.name +
        "　剩餘 " +
        seconds +
        " 秒";


    /* =====================================
       進度條
    ===================================== */

    progress.style.width =
        ((t / CYCLE) * 100) +
        "%";


    /* =====================================
       下一幀
    ===================================== */

    animationID =
        requestAnimationFrame(update);

}


/* =========================================
   開始 / 暫停
========================================= */

startBtn.addEventListener(
    "click",
    function() {


        /* 開始 */

        if (!running) {


            running = true;


            if (pausedTime === 0) {

                startTime =
                    performance.now();

            }

            else {

                startTime =
                    performance.now()
                    - pausedTime;

            }


            startBtn.textContent =
                "⏸ 暫停";


            update();

        }


        /* 暫停 */

        else {


            running = false;


            cancelAnimationFrame(
                animationID
            );


            pausedTime =
                performance.now()
                - startTime;


            lightArea.classList.remove(
                "flash"
            );


            status.classList.remove(
                "flash"
            );


            status.textContent =
                "暫停";


            countdown.textContent =
                "已暫停";


            startBtn.textContent =
                "▶ 繼續";

        }

    }
);


/* =========================================
   重置
========================================= */

resetBtn.addEventListener(
    "click",
    function() {


        running = false;


        cancelAnimationFrame(
            animationID
        );


        startTime = 0;

        pausedTime = 0;


        lightArea.classList.remove(
            "flash"
        );


        status.classList.remove(
            "flash"
        );


        status.classList.remove(
            "dark"
        );


        status.textContent =
            "暫停";


        countdown.textContent =
            "等待開始";


        progress.style.width =
            "0%";


        startBtn.textContent =
            "▶ 開始";

    }
);

</script>


</body>

</html>
